name: Deploy Docs

on:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'typedoc.json'
            - 'typedoc-readme.md'
            - 'tsconfig.json'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - '.github/workflows/publish-docs.yml'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: deploy-docs
    cancel-in-progress: true

jobs:
    deploy-docs:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build docs
              run: pnpm run docs

            - name: Deploy to gh-pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs
                  cname: splatoon3api.strassburger.dev
